# XcodeGen spec (ADR-012): the Xcode project is generated, never hand-edited.
#   brew install xcodegen && cd iosApp && xcodegen generate
# Swift packages, when any, are declared here with `exactVersion:` (this file is scanned by the project hooks
# and by tools/check-deps.sh, the generated Package.resolved is not versioned).
name: iosApp
options:
  bundleIdPrefix: app.trouvetout.proto
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  # EmbeddingGemma 2 runtime (ADR-021). The package downloads its prebuilt xcframework from the GitHub release,
  # pinned by checksum in its own manifest. 0.18.1, not 0.19.0: the 0.19.0 tag ships Swift sources newer than the
  # 0.18.1 binary it points to (`LiteRtLmSpeculativeDecodingMode` missing); 0.18.1 is consistent and has the
  # EmbeddingGemma 2 fix.
  # Pinned by commit (the v0.18.1 tag), not by the tag name: a moved tag cannot swap the binary and its checksum.
  LiteRTLM:
    url: https://github.com/google-ai-edge/LiteRT-LM
    revision: bda624851d74be34d4e1f7fac1fc4155939539c7
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
    # The Kotlin framework is built by a Gradle run script; Xcode's script sandbox would block it.
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
      # The embedding models, fetched and verified by `:models:fetchModels` (ADR-021, ADR-022), never committed.
      - path: ../models/build/bundled/models/embeddinggemma-2-text-270m.litertlm
        optional: true
        buildPhase: resources
      - path: ../models/build/bundled/models/embeddinggemma-2-text-vision-440m.litertlm
        optional: true
        buildPhase: resources
      # The label vectors of photo naming (B8), computed by `:tools:genLabels` and committed (no weights).
      - path: ../models/labels_fr_en.catalog
        buildPhase: resources
      # Its manifest, so that the app identifies the model by checksum like Android does.
      - path: ../models/manifest.json
        buildPhase: resources
    dependencies:
      # Embedded widget extension (B5); it links neither the core nor any package.
      - target: CaptureWidget
      - package: LiteRTLM
        product: LiteRTLM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.trouvetout.proto
        INFOPLIST_FILE: iosApp/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        # Static Kotlin framework: the app links the system SQLite that the native SQLDelight driver calls.
        OTHER_LDFLAGS: "$(inherited) -framework Shared -lsqlite3"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          export JAVA_HOME="${JAVA_HOME:-$(/usr/libexec/java_home -v 17)}"
          cd "$SRCROOT/.."
          sh ./gradlew :shared:embedAndSignAppleFrameworkForXcode :models:fetchModels
  CaptureWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CaptureWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.trouvetout.proto.CaptureWidget
        INFOPLIST_FILE: CaptureWidget/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"
  iosAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: iosAppTests
    dependencies:
      - target: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.trouvetout.proto.tests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  iosApp:
    build:
      targets:
        iosApp: all
        iosAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - iosAppTests
