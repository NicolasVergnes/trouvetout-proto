# XcodeGen spec (ADR-012): the Xcode project is generated, never hand-edited.
#   brew install xcodegen && cd iosApp && xcodegen generate
name: iosApp
options:
  bundleIdPrefix: app.trouvetout.proto
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
    # The Kotlin framework is built by a Gradle run script; Xcode's script sandbox would block it.
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.trouvetout.proto
        PRODUCT_NAME: TrouveTout
        INFOPLIST_FILE: iosApp/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        OTHER_LDFLAGS: "$(inherited) -framework Shared"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
  iosAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: iosAppTests
    dependencies:
      - target: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.trouvetout.proto.tests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  iosApp:
    build:
      targets:
        iosApp: all
        iosAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - iosAppTests
