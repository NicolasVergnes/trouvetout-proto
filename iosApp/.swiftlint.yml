included:
  - iosApp
  - iosAppTests
  - CaptureWidget
excluded:
  - iosApp.xcodeproj
  - build
opt_in_rules:
  - empty_count
  - closure_spacing
  - explicit_init
  - force_unwrapping
line_length:
  warning: 120
  error: 160
# Same convention as SwiftFormat's trailingCommas rule.
trailing_comma:
  mandatory_comma: true
identifier_name:
  min_length: 2
  excluded: [id, x, y]
custom_rules:
  no_logging:
    name: "No logging in the app"
    regex: '(^|[^A-Za-z0-9_.])(print|debugPrint|NSLog|os_log)\(|Logger\(subsystem'
    message: "The app never logs from Swift: business data must stay out of logs (CLAUDE.md rule 3)."
    severity: error
    excluded: ".*Tests/.*"
