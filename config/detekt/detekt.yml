# Overrides on top of detekt's default config (buildUponDefaultConfig = true).
build:
  maxIssues: 0

style:
  MaxLineLength:
    maxLineLength: 120
  ReturnCount:
    max: 3
    excludeGuardClauses: true
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  MagicNumber:
    ignoreAnnotated: ['Composable', 'Preview']
    # detekt's default test list plus the KMP source sets of this repo (jvmCommonTest, androidHostTest).
    excludes: ['**/test/**', '**/androidTest/**', '**/androidHostTest/**', '**/commonTest/**', '**/jvmTest/**', '**/jvmCommonTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**', '**/iosSimulatorArm64Test/**']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
  ForbiddenComment:
    active: false
  # Rule 3 of CLAUDE.md: no business data in logs. Only the injected LogcatLogger may touch android.util.Log.
  ForbiddenImport:
    active: true
    imports:
      - value: 'android.util.Log'
        reason: 'Log through the injected app.trouvetout.core.log.Logger (identifiers only).'
    excludes: ['**/log/LogcatLogger.kt']

complexity:
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 8
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']
    excludes: ['**/test/**', '**/androidTest/**', '**/androidHostTest/**', '**/commonTest/**', '**/jvmTest/**', '**/jvmCommonTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**', '**/iosSimulatorArm64Test/**']
  TooManyFunctions:
    ignorePrivate: true
    # A screen ViewModel exposes one function per user action (item sheet: save, pin, archive, move, take, lend…).
    thresholdInClasses: 18

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
    excludes: ['**/test/**', '**/androidTest/**', '**/androidHostTest/**', '**/commonTest/**', '**/jvmTest/**', '**/jvmCommonTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**', '**/iosSimulatorArm64Test/**']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Za-z0-9]*'
