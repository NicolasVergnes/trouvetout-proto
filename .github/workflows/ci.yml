name: CI

on:
  push:
    branches: [main, "lot/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

# Third-party actions are pinned by commit SHA (the tag is kept in a comment); bump them deliberately.
jobs:
  shared-android:
    name: shared + Android (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          validate-wrappers: true
      - name: Make scripts executable
        run: chmod +x gradlew tools/*.sh .claude/hooks/*.sh
      - name: Build, test, lint
        run: ./gradlew :shared:allTests :androidApp:assembleDebug :androidApp:lintDebug :androidApp:assembleRelease :tools:build ktlintCheck detekt
      - name: Project checks (dependencies, permissions, network, hooks)
        run: |
          tools/check-deps.sh
          tools/check-network.sh
          tools/test-hooks.sh
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: androidApp-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 7
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gradle-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          retention-days: 7

  android-device:
    name: Android platform tests (API 29 managed device)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          validate-wrappers: true
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: chmod +x gradlew
      - name: Run the instrumented tests on the API 29 managed device
        # The test runner (UTP) artifacts are resolved only while the device runs, outside the metadata
        # workflow's dry run: this job alone verifies leniently; the build job stays strict.
        run: ./gradlew --dependency-verification lenient :androidApp:api29DebugAndroidTest
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-device-reports
          path: |
            androidApp/build/reports/androidTests/**
            androidApp/build/outputs/androidTest-results/**
          retention-days: 7

  ios:
    name: shared (native) + iOS (macOS)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          validate-wrappers: true
      - name: Make scripts executable
        run: chmod +x gradlew tools/*.sh
      - name: Install XcodeGen, SwiftLint and SwiftFormat
        run: brew install xcodegen swiftlint swiftformat
      - name: Toolchain versions
        run: |
          xcodebuild -version
          xcodegen --version
          swiftlint version
          swiftformat --version
      - name: SwiftLint / SwiftFormat
        working-directory: iosApp
        run: |
          swiftlint lint --strict
          swiftformat --lint .
      - name: Select simulator
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries | sort_by(.key) | reverse | .[] | select(.key | contains("iOS")) | .value[] | select(.isAvailable) | select(.name | startswith("iPhone"))] | first | .udid')
          test -n "$UDID" && test "$UDID" != "null"
          echo "Simulator: $UDID"
          echo "IOS_SIMULATOR_DEVICE=$UDID" >> "$GITHUB_ENV"
      - name: Kotlin/Native tests and framework
        run: ./gradlew :shared:iosSimulatorArm64Test :shared:linkDebugFrameworkIosSimulatorArm64
      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate
      - name: Build and test on simulator
        run: |
          xcodebuild test \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination "id=$IOS_SIMULATOR_DEVICE" \
            -resultBundlePath build/ios-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Upload iOS results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-results
          path: build/ios-tests.xcresult
          retention-days: 7
